name: CatalogHub CI Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  backend-check:
    name: Backend Syntax & Dependency Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package.json

      - name: Install Dependencies
        working-directory: ./server
        run: npm ci

      - name: Validate Syntax & Modules
        working-directory: ./server
        run: node -c src/server.js src/app.js src/controllers/product.controller.js src/services/product.service.js src/repositories/product.repository.js

  frontend-build:
    name: Frontend React Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package.json

      - name: Install Dependencies
        working-directory: ./client
        run: npm ci

      - name: Run Vite Build
        working-directory: ./client
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.railway.app

  docker-build:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: cataloghub-server:test

      - name: Build Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: cataloghub-client:test

