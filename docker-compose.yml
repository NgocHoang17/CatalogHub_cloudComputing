services:
  # MySQL 8.0 Database Service
  mysql:
    image: mysql:8.0
    container_name: cataloghub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: catalog_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -prootpassword || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cataloghub-net

  # Backend API Service (NodeJS + Knex + Express)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cataloghub-server
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: catalog_db
      CLIENT_ORIGIN: "*"
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cataloghub-net

  # Frontend Web Client Service (React 18 + Vite + Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:5000"
    container_name: cataloghub-client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server
    networks:
      - cataloghub-net

volumes:
  mysql_data:
    driver: local

networks:
  cataloghub-net:
    driver: bridge

